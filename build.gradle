// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
  repositories {
    google()
    //jcenter()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://jcenter.bintray.com" } 
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:4.1.2'
    classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.8.4'
    classpath 'com.ofg:uptodate-gradle-plugin:1.6.3'
  }
}

allprojects {
  repositories {
    google()
    //jcenter()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://jcenter.bintray.com" } 
  }
  tasks.withType(JavaCompile) {
    sourceCompatibility = rootProject.ext.javaVersion
    targetCompatibility = rootProject.ext.javaVersion
  }

  tasks.withType(GroovyCompile) {
    sourceCompatibility = rootProject.ext.javaVersion
    targetCompatibility = rootProject.ext.javaVersion
  }
}

ext {
  javaVersion = JavaVersion.VERSION_11

  GROUP = 'com.github.onedeba7'
  VERSION_NAME = "${ANDRESGUARD_VESSION}"

  POM_PACKAGING = "pom"
  POM_DESCRIPTION = "Android Resource Proguard Core Lib"

  POM_URL = "https://github.com/onedeba7/AndResGuard"
  POM_SCM_URL = "https://github.com/onedeba7/AndResGuard.git"
  POM_ISSUE_URL = 'https://github.com/onedeba7/AndResGuard/issues'

  POM_LICENCE_NAME = "Apache-2.0"
  POM_LICENCE_URL = " http://www.apache.org/licenses/"
  POM_LICENCE_DIST = "repo"

  POM_DEVELOPER_ID = "Tencent Wechat"
  POM_DEVELOPER_NAME = "Tencent Wechat, Inc."

  BINTRAY_LICENCE = ["Apache-2.0"]
  BINTRAY_ORGANIZATION = "wemobiledev"
}
